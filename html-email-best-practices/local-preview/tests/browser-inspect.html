<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Email inspector fixture</title>
<style>

  #fixture-email { position: absolute; left: 32px; top: 40px; width: 600px; padding: 20px; box-sizing: border-box; border: 1px solid #aaa; }

</style>
<aside>UNRELATED_APP_SECRET</aside>

</div>
<div id="broken-email"><img alt="Broken fixture" src="data:image/png;base64,broken"></div>
