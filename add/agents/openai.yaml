interface:
  display_name: "Add"
  short_description: "Stage chat-scoped work on main"
  default_prompt: "Use $add to rebuild the staged set for this conversation only. In `/add push`, commit only that chat-scoped work plus the minimum already-modified Railway-build-critical diff, prefer commit slices around 500 changed lines, never push a commit over 2,000 changed lines, and push `main` only while checked out on `main`."
policy:
  allow_implicit_invocation: false
