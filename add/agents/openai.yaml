interface:
  display_name: "Add"
  short_description: "Stage chat-scoped work on main"
  default_prompt: "Use $add to first clear any existing staged changes, then stage only the changes that belong to this conversation while leaving unrelated work unstaged. In `/add push`, include only the minimum already-modified diff required for a successful Railway build, strongly prefer commit slices around 500 changed lines, never push any single commit over 2,000 changed lines, and push `main` directly while checked out on `main`."
policy:
  allow_implicit_invocation: false
