appId: host.exp.Exponent
---
# Template only. Do not hard-code real credentials in a flow file.
# Pass credentials at runtime with:
#   maestro test -e GOOGLE_EMAIL=... -e GOOGLE_PASSWORD=... flow.yaml
#
# Google may insert extra screens, 2FA, CAPTCHA, passkeys, or account-chooser
# surfaces. Inspect screenshots/hierarchy after every failure.
- tapOn: "Email or phone"
- inputText: "${GOOGLE_EMAIL}"
- tapOn: "Next"
- waitForAnimationToEnd
- tapOn: "Enter your password"
- inputText: "${GOOGLE_PASSWORD}"
- tapOn: "Next"
- waitForAnimationToEnd
- takeScreenshot:
    path: google-signin-after-password
